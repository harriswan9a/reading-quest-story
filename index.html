<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF6E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1524" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>放學後的祕密書境</title>
<style>
:root{
  --bg:#FFF6E5;--surface:#FFFFFF;--surface-2:#FFEFD3;--ink:#2B2140;--muted:#5F5370;--edge:#2B2140;--drop:#2B2140;
  --brand:#FF8A3D;--on-brand:#2B2140;
  --light:#F5B700;--light-soft:#FFF1BF;--light-ink:#6E4300;
  --pass:#1F9D55;--pass-soft:#DDF6E6;--pass-ink:#0B5A2E;
  --explore:#5B4BDB;--on-explore:#FFFFFF;--explore-soft:#ECE8FF;--explore-ink:#3A2BB0;
  --danger:#B42318;--danger-soft:#FDE4E1;
  --neutral-soft:#EFE9F5;--neutral-ink:#4E4460;
  --focus:#3A2BB0;
  --radius:22px;--radius-sm:14px;
  font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light dark;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1A1524;--surface:#262036;--surface-2:#2F2742;--ink:#F5EFFF;--muted:#C4B9D6;--edge:#4B4064;--drop:#0B0812;
  --brand:#FF9A55;--on-brand:#1A1524;
  --light:#FFD24D;--light-soft:#3D2E10;--light-ink:#FFD58A;
  --pass:#4ADE80;--pass-soft:#16352A;--pass-ink:#9AF0BA;
  --explore:#A89BFF;--on-explore:#1A1524;--explore-soft:#2A2550;--explore-ink:#D6D0FF;
  --danger:#FF8A80;--danger-soft:#3D1D1D;
  --neutral-soft:#322A44;--neutral-ink:#D8CFE6;
  --focus:#D6D0FF;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6}
#main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1.3}
h2{font-size:21px;font-weight:800;line-height:1.3}
h3{font-size:18px;font-weight:800;line-height:1.3}
.logo{width:42px;height:42px;display:grid;place-items:center;border:3px solid var(--edge);border-radius:13px;background:var(--brand);color:var(--on-brand);box-shadow:0 3px 0 var(--drop);transform:rotate(-6deg);font-size:22px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
button{font:inherit;color:inherit;touch-action:manipulation;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:3px solid var(--edge);border-radius:var(--radius-sm);background:var(--surface);font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--drop);transition:transform .12s ease-out,box-shadow .12s ease-out}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--drop)}
button:disabled,button[aria-disabled=true]{opacity:.55;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-explore{background:var(--explore);color:var(--on-explore)}
.btn-wide{width:100%;min-height:56px;font-size:19px}
.btn-plain{border:0;box-shadow:none;background:none;color:var(--explore-ink);text-decoration:underline;padding:6px 10px;min-height:44px}
a{color:var(--explore-ink)}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.card{margin:16px 0;padding:18px;background:var(--surface);border:3px solid var(--edge);border-radius:var(--radius);box-shadow:0 5px 0 var(--drop)}
.card.soft{background:var(--surface-2)}
.muted{color:var(--muted);font-size:15px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--neutral-soft);color:var(--neutral-ink);vertical-align:middle}
.badge.light{background:var(--light-soft);color:var(--light-ink)}
.badge.pass{background:var(--pass-soft);color:var(--pass-ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row button{flex:1 1 140px}

/* 狀態 */
.state{margin:40px 0;padding:28px 18px;text-align:center;border:3px dashed var(--edge);border-radius:var(--radius);background:var(--surface-2)}
.state p{margin-top:8px}
.state .big{font-size:40px;line-height:1}

/* 首頁 */
.partner{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.partner-face{grid-row:span 2;width:88px;height:88px;display:grid;place-items:center;font-size:52px;line-height:1;border:3px solid var(--edge);border-radius:50%;background:var(--surface-2)}
.partner h2{font-size:20px}
.lights{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lights .num{font-size:44px;font-weight:800;line-height:1;color:var(--light-ink);font-variant-numeric:tabular-nums}
.lights-bar{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.lights-bar span{width:28px;height:28px;border-radius:50%;border:3px solid var(--edge);background:var(--surface);display:grid;place-items:center;font-size:15px}
.lights-bar span.on{background:var(--light)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.forms div{padding:10px 6px;text-align:center;border:2px solid var(--edge);border-radius:var(--radius-sm);background:var(--surface-2);font-size:15px;font-weight:700}
.forms div.locked{opacity:.6;background:var(--neutral-soft)}
.forms .face{font-size:30px;display:block;line-height:1.2}
.forms small{display:block;font-weight:600;color:var(--muted);font-size:13px}

/* 故事清單 */
.chapter{margin-top:22px}
.chapter h2{margin-bottom:10px}
.scenes{display:flex;flex-direction:column;gap:10px}
.scene-btn{width:100%;justify-content:space-between;text-align:left;padding:12px 16px;min-height:56px}
.scene-btn .t{display:flex;align-items:center;gap:10px}
.scene-btn .no{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--edge);border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:14px}
.scene-btn.done .no{background:var(--pass);color:#fff}
.scene-btn.locked{background:var(--neutral-soft);color:var(--neutral-ink)}
.scene-btn.locked .no{background:var(--surface)}
.scene-btn .need{font-size:14px;font-weight:700;color:var(--light-ink);background:var(--light-soft);padding:2px 10px;border-radius:999px;white-space:nowrap}

/* 劇情 */
.scene-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.scene-head .muted{font-weight:700}
.bg{margin:10px 0 14px;padding:10px 14px;border-left:6px solid var(--explore);border-radius:8px;background:var(--explore-soft);color:var(--explore-ink);font-size:16px}
.lines{display:flex;flex-direction:column;gap:12px}
.line{display:flex;flex-direction:column;gap:2px;animation:pop .25s ease-out}
.line .who{font-size:14px;font-weight:800;color:var(--muted)}
.line .who .note{font-weight:600}
.bubble{padding:12px 16px;border:3px solid var(--edge);border-radius:18px;border-top-left-radius:6px;background:var(--surface);max-width:92%;align-self:flex-start;overflow-wrap:anywhere}
.line.me{align-items:flex-end}
.line.me .bubble{border-top-left-radius:18px;border-top-right-radius:6px;background:var(--brand);color:var(--on-brand)}
.line.xiaoye .bubble{background:var(--light-soft)}
.narr{padding:4px 6px;color:var(--muted);font-style:normal;text-align:center}
.guide{padding:12px 14px;border:2px dashed var(--edge);border-radius:var(--radius-sm);background:var(--pass-soft);color:var(--pass-ink);font-weight:700;font-size:16px}
.screen{margin:8px 0;padding:28px 16px;text-align:center;font-size:21px;font-weight:800;border:3px solid var(--edge);border-radius:var(--radius);background:var(--explore-soft);color:var(--explore-ink)}
.options{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.options button{justify-content:flex-start;text-align:left;width:100%;min-height:52px}
.options button.btn-explore{justify-content:center}
.options button[aria-pressed=true]{background:var(--pass-soft);color:var(--pass-ink)}
.options button[aria-pressed=false]{opacity:.5;box-shadow:none}
.hotspot-text{padding:8px 12px;color:var(--muted)}
.controls{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));margin-top:18px;display:flex;flex-direction:column;gap:10px}
.controls .pair{display:flex;gap:10px}
.controls .pair button{flex:1}
.wait{padding:14px 16px;border:3px solid var(--edge);border-radius:var(--radius);background:var(--light-soft);color:var(--light-ink);font-weight:700}
.wait .muted{color:inherit;opacity:.85}
.reward{padding:12px 16px;border-radius:var(--radius-sm);background:var(--pass-soft);color:var(--pass-ink);font-weight:800;text-align:center}

/* 書架 */
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
.book{padding:14px 16px;background:var(--surface);border:3px solid var(--edge);border-left-width:10px;border-radius:var(--radius-sm);box-shadow:0 3px 0 var(--drop)}
.book.new{border-left-color:var(--light)}
.book.old{border-left-color:var(--neutral-ink)}
.book h3{margin:6px 0 2px;overflow-wrap:anywhere}
.book p{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:2px dashed var(--edge);border-radius:var(--radius)}

/* 底部導覽 */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--surface);border-top:3px solid var(--edge)}
#nav button{flex:1;max-width:180px;min-height:52px;flex-direction:column;gap:0;padding:6px;border-width:2px;box-shadow:none;font-size:14px;line-height:1.2}
#nav button .ico{font-size:22px;line-height:1.2}
#nav button[aria-current=page]{background:var(--brand);color:var(--on-brand)}

@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*,::before,::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="main">
  <header><h1><span class="logo" aria-hidden="true">📖</span>放學後的祕密書境</h1></header>
  <main id="view" aria-live="polite"><div class="state"><p class="big" aria-hidden="true">📖</p><p>正在打開書境……</p></div></main>
</div>
<nav id="nav" aria-label="主要導覽" hidden>
  <button data-page="home" aria-current="page"><span class="ico" aria-hidden="true">🏫</span>首頁</button>
  <button data-page="story"><span class="ico" aria-hidden="true">📜</span>故事</button>
  <button data-page="shelf"><span class="ico" aria-hidden="true">📚</span>書架</button>
</nav>
<script type="module" src="./app.js"></script>
</body>
</html>
